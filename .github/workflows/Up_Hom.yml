name: Act🚀🚀 Hom

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Generar hom.json
        run: python gene_hom.py

      - name: Commit y push
        run: |
          git config user.name "Bot"
          git config user.email "bot@example.com"
          git add hom.json
          git commit -m "Act hom $(date -u +%Y-%m-%d_%H:%M:%S)" || echo "Sin cambios"
          git push
